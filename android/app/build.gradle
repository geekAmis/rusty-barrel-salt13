plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.rustybarrel'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.rustybarrel'
        minSdk 24
        targetSdk 34
        versionCode 20200
        versionName '2.2.0-alpha'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs += ["$buildDir/generated/gameAssets"]
        }
    }
}

def gameAssetsDir = layout.buildDirectory.dir("generated/gameAssets/game")

tasks.register("copyGameAssets", Copy) {
    from("../../game")
    into(gameAssetsDir)
}

tasks.named("preBuild") {
    dependsOn("copyGameAssets")
}
